<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<title>Challenge Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f3f4fb; --card:#fff; --fg:#161a2b; --muted:#6b7285; --line:#e6e8f2; --soft:#f6f7fd;
    --accent:#6366f1; --accent2:#8b5cf6; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
    --side:#14123a; --side2:#1d1a52; --shadow:0 1px 2px rgba(20,18,58,.04),0 6px 20px rgba(20,18,58,.05);
  }
  :root { color-scheme:light; }
  /* dark: follows the system unless the user picked a theme (data-theme on <html>) */
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme:dark;
    --bg:#0e1019; --card:#171a2b; --fg:#f1f3fb; --muted:#a3abc4; --line:#2b3150; --soft:#1f2338; --input:#10121f;
    --accent:#8b94ff; --accent2:#b197fc; --side:#0a0b16; --side2:#0a0b16; --shadow:0 0 0 1px rgba(255,255,255,.02),0 8px 24px rgba(0,0,0,.35);
  } }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#0e1019; --card:#171a2b; --fg:#f1f3fb; --muted:#a3abc4; --line:#2b3150; --soft:#1f2338; --input:#10121f;
    --accent:#8b94ff; --accent2:#b197fc; --side:#0a0b16; --side2:#0a0b16; --shadow:0 0 0 1px rgba(255,255,255,.02),0 8px 24px rgba(0,0,0,.35);
  }
  :root[data-theme="dark"] #side { border-right:1px solid var(--line); }
  :root[data-theme="dark"] .card { background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff),var(--card)); }
  :root[data-theme="dark"] .hero { background:linear-gradient(135deg,#4338ca,#7c3aed 60%,#be185d); }
  :root[data-theme="dark"] .bar { background:#0f1222; }
  :root[data-theme="dark"] .chip, :root[data-theme="dark"] .qbtn, :root[data-theme="dark"] .seg button, :root[data-theme="dark"] .iconbtn, :root[data-theme="dark"] .btn.ghost { background:var(--soft); }
  :root[data-theme="dark"] .task { background:var(--soft); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) #side { border-right:1px solid var(--line); }
    :root:not([data-theme="light"]) .card { background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff),var(--card)); }
    :root:not([data-theme="light"]) .chip, :root:not([data-theme="light"]) .qbtn, :root:not([data-theme="light"]) .seg button, :root:not([data-theme="light"]) .iconbtn, :root:not([data-theme="light"]) .btn.ghost { background:var(--soft); }
  }
  .totop { position:fixed; right:22px; bottom:22px; z-index:40; width:46px; height:46px; border-radius:50%; border:0; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 22px rgba(99,102,241,.45); display:grid; place-items:center; opacity:0; transform:translateY(12px); pointer-events:none; transition:opacity .2s, transform .2s; }
  .totop.show { opacity:1; transform:none; pointer-events:auto; }
  .totop:hover { filter:brightness(1.1); }
  /* onboarding */
  .step h3 { display:flex; align-items:center; gap:10px; }
  .stepn { width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; display:grid; place-items:center; font-size:13px; }
  .opts { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); }
  .opt { text-align:left; display:flex; flex-direction:column; gap:6px; padding:16px; border:1px solid var(--line); background:var(--soft); color:var(--fg); border-radius:14px; transition:border-color .15s, transform .15s; }
  .opt:hover { border-color:var(--accent); transform:translateY(-2px); }
  .oic { color:var(--accent); }
  .tdot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:2px; vertical-align:0; }
  .t0 { background:#6366f1; } .t1 { background:#0ea5e9; } .t2 { background:#f59e0b; }
  .focus .task em { max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:uppercase; }
  /* chat */
  .chatfab { position:fixed; right:22px; bottom:80px; z-index:40; width:50px; height:50px; border-radius:50%; border:0; color:#fff; background:linear-gradient(135deg,#ec4899,var(--accent2)); box-shadow:0 8px 22px rgba(139,92,246,.45); display:grid; place-items:center; }
  #chat { position:fixed; right:22px; bottom:22px; z-index:60; width:min(400px,calc(100vw - 24px)); height:min(580px,calc(100vh - 44px)); background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 50px rgba(10,10,30,.35); display:none; flex-direction:column; overflow:hidden; }
  #chat.open { display:flex; }
  .chat-h { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .chat-h b { display:flex; align-items:center; gap:8px; }
  .chat-x { background:rgba(255,255,255,.18); border:0; color:#fff; width:30px; height:30px; border-radius:8px; display:grid; place-items:center; }
  .chat-b { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .cm { max-width:88%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.45; word-wrap:break-word; }
  .cm.a { background:var(--soft); align-self:flex-start; border-bottom-left-radius:4px; }
  .cm.u { background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .cm.err { background:color-mix(in srgb,var(--bad) 14%,transparent); color:var(--bad); align-self:stretch; max-width:100%; }
  .typing { display:flex; gap:4px; } .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1s infinite; } .typing i:nth-child(2) { animation-delay:.15s; } .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }
  .plancard { border:1px solid var(--accent); border-radius:14px; padding:12px; background:color-mix(in srgb,var(--accent) 8%,transparent); }
  .plancard .pr { margin-top:8px; font-size:13px; }
  .chat-f { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); align-items:flex-end; }
  .chat-f textarea { min-height:40px; max-height:110px; resize:none; }
  .chat-f .btn { padding:9px 12px; }
  /* custom dropdown */
  .dd { position:relative; }
  .dd-btn { width:100%; display:flex; align-items:center; gap:8px; text-align:left; background:var(--input,var(--card)); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; transition:border-color .15s, box-shadow .15s; }
  .dd-btn:hover { border-color:var(--muted); }
  .dd-btn:focus-visible, .dd-btn.open { outline:0; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); }
  .dd-btn .dd-t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dd-btn > .i { color:var(--muted); transition:transform .15s; } .dd-btn.open > .i { transform:rotate(180deg); }
  .dd.st { width:auto; min-width:180px; } .dd.st .dd-btn { font-weight:600; }
  .toolbar .dd { width:auto; min-width:190px; }
  .dd-dot { width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,.08) inset; }
  .dd-menu { position:fixed; z-index:200; max-height:320px; overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px; box-shadow:0 12px 32px rgba(10,10,30,.28); animation:ddin .12s ease-out; }
  @keyframes ddin { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
  .dd-opt { width:100%; display:flex; align-items:center; gap:10px; background:none; border:0; color:var(--fg); text-align:left; padding:8px 10px; border-radius:8px; }
  .dd-opt .dd-t { flex:1; white-space:nowrap; }
  .dd-opt .i { color:var(--accent); }
  .dd-opt:hover, .dd-opt:focus-visible { outline:0; background:var(--soft); }
  .dd-opt.on { background:color-mix(in srgb,var(--accent) 14%,transparent); font-weight:600; }
  .topr { display:flex; align-items:center; gap:10px; }
  .iconbtn { width:42px; height:42px; flex:none; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); box-shadow:var(--shadow); }
  .iconbtn:hover { color:var(--accent); border-color:var(--accent); }
  #auththeme { position:fixed; top:16px; right:16px; width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); display:grid; place-items:center; box-shadow:var(--shadow); }
  /* calendar picker */
  .cal { margin:10px 0 4px; border:1px solid var(--line); border-radius:12px; padding:10px; background:var(--soft); }
  .calh { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calh button { width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); display:grid; place-items:center; }
  .calw, .calg { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
  .calw span { font-size:11px; font-weight:600; color:var(--muted); padding:4px 0; }
  .cd { height:32px; border:0; background:none; color:var(--fg); border-radius:8px; font-size:13px; }
  .cd:hover { background:var(--line); }
  .cd.td { font-weight:800; color:var(--accent); }
  .cd.in { background:color-mix(in srgb,var(--accent) 18%,transparent); border-radius:0; }
  .cd.sel { background:var(--accent); color:#fff; }
  .cd.end { background:var(--accent2); }
  .modal .card { max-height:94vh; overflow:auto; }
  .dates { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; }
  .dpick, .dlen { text-align:left; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:12px; padding:8px 12px; }
  .dpick b, .dlen b { font-size:14px; display:block; }
  .dpick.on { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); }
  .dlen { background:var(--soft); min-width:64px; }
  .cd.end { background:var(--accent2); color:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif; -webkit-font-smoothing:antialiased; }
  .hide { display:none !important; }
  button { font:inherit; cursor:pointer; }
  input,select,textarea { font:inherit; color:var(--fg); background:var(--input,var(--card)); border:1px solid var(--line); border-radius:10px; padding:8px 10px; width:100%; transition:border-color .15s, box-shadow .15s; }
  input:focus,select:focus,textarea:focus { outline:0; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); }
  textarea { resize:vertical; min-height:38px; }

  /* layout */
  #app { display:flex; min-height:100vh; }
  #side { width:236px; flex:none; background:linear-gradient(180deg,var(--side),var(--side2)); color:#c9cbe8; display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; gap:10px; align-items:center; padding:4px 8px 22px; color:#fff; }
  .logo { width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:grid; place-items:center; font-weight:800; font-size:13px; }
  .brand b { display:block; font-size:15px; } .brand small { color:#8e91c0; font-size:11px; }
  #tabs { display:flex; flex-direction:column; gap:3px; }
  #tabs button { display:flex; align-items:center; gap:11px; background:none; border:0; color:inherit; padding:10px 12px; border-radius:10px; text-align:left; font-weight:500; }
  #tabs button:hover { background:rgba(255,255,255,.07); }
  #tabs button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 6px 16px rgba(99,102,241,.35); }
  #tabs .ic { width:20px; text-align:center; }
  .side-foot { margin-top:auto; padding:12px 8px 0; border-top:1px solid rgba(255,255,255,.08); font-size:12px; }
  .side-foot span { display:block; overflow:hidden; text-overflow:ellipsis; margin-bottom:8px; }
  .side-foot button { background:rgba(255,255,255,.08); color:#fff; border:0; border-radius:8px; padding:6px 12px; width:100%; }
  .content { flex:1; min-width:0; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding:26px 32px 6px; flex-wrap:wrap; }
  .top h2 { margin:0; font-size:26px; letter-spacing:-.02em; }
  .top p { margin:2px 0 0; color:var(--muted); }
  main { padding:18px 32px 48px; max-width:1280px; }

  /* primitives */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow); }
  .card h3 { margin:0 0 14px; font-size:15px; }
  .grid { display:grid; gap:16px; }
  .g-stats { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:16px; }
  .g-2 { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); margin-bottom:16px; }
  .muted { color:var(--muted); }
  .btn { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:0; border-radius:10px; padding:9px 16px; font-weight:600; box-shadow:0 4px 12px rgba(99,102,241,.3); }
  .btn.ghost { background:var(--card); color:var(--fg); border:1px solid var(--line); box-shadow:none; }
  .btn.sm { padding:6px 10px; }
  .pill { display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--soft); color:var(--muted); border:1px solid var(--line); }
  .pill.now { background:var(--accent); color:#fff; border-color:transparent; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar select { width:auto; min-width:180px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:var(--card); border:1px solid var(--line); color:var(--muted); padding:6px 13px; border-radius:99px; font-weight:600; font-size:13px; }
  .chip b { color:var(--fg); margin-left:4px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; } .chip.on b { color:#fff; }
  .lbl { display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
  .bar { height:8px; background:var(--soft); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:99px; }
  .bar.ok i { background:var(--ok); }

  /* dashboard */
  .hero { background:linear-gradient(135deg,#4f46e5,#8b5cf6 60%,#ec4899); color:#fff; border:0; display:flex; align-items:center; gap:22px; flex-wrap:wrap; margin-bottom:16px; }
  .hero h3 { color:#fff; font-size:22px; margin:0 0 4px; letter-spacing:-.01em; }
  .hero p { margin:0; opacity:.85; }
  .hero .ring text { fill:#fff; }
  .stat .v { font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .stat .k { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .i { stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; vertical-align:-3px; flex:none; }
  .lbl .i { vertical-align:-2px; margin-right:2px; }
  .btn { display:inline-flex; align-items:center; gap:6px; }
  .ih { display:flex; align-items:center; gap:8px; } .ih .i { color:var(--accent); }
  .del, .empty .big { display:grid; place-items:center; }
  .empty .big { color:var(--muted); opacity:.6; margin-bottom:8px; }
  .stat .ico { float:right; width:38px; height:38px; border-radius:11px; display:grid; place-items:center; }
  .c-ok { background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
  .c-ac { background:color-mix(in srgb,var(--accent) 15%,transparent); color:var(--accent); }
  .c-wn { background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn); }
  .c-bl { background:color-mix(in srgb,#0ea5e9 15%,transparent); color:#0ea5e9; }
  .focus .task { display:flex; gap:12px; align-items:flex-start; padding:10px 12px; background:var(--soft); border-radius:12px; margin-bottom:8px; }
  .focus .task em { font-style:normal; font-size:11px; font-weight:700; padding:3px 8px; border-radius:7px; color:#fff; flex:none; margin-top:1px; }
  .em-ai { background:#6366f1; } .em-job { background:#0ea5e9; } .em-st { background:#f59e0b; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
  .seg button { border:1px solid var(--line); background:var(--card); color:var(--muted); padding:6px 11px; border-radius:9px; font-size:12px; font-weight:600; }
  .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .seg button.on.s-ok { background:var(--ok); border-color:var(--ok); }
  .heat { display:grid; grid-template-columns:repeat(auto-fill,minmax(30px,1fr)); gap:6px; }
  .heat button { aspect-ratio:1; border:0; border-radius:8px; background:var(--soft); color:var(--muted); font-size:11px; font-weight:600; border:1px solid var(--line); }
  .heat button.ok { background:var(--ok); color:#fff; border-color:var(--ok); }
  .heat button.part { background:var(--warn); color:#fff; border-color:var(--warn); }
  .heat button.prog { background:var(--accent); color:#fff; border-color:var(--accent); }
  .heat button.skip { background:var(--line); text-decoration:line-through; }
  .heat button.rest { background:#0ea5e9; color:#fff; border-color:#0ea5e9; }
  .heat button.out { background:#ec4899; color:#fff; border-color:#ec4899; }
  .day.rest { border-left-color:#0ea5e9; } .day.out { border-left-color:#ec4899; }
  .dctl { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .qbtn { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:var(--card); color:var(--muted); border-radius:9px; padding:6px 10px; font-size:12px; font-weight:600; }
  .qbtn:hover { color:var(--fg); border-color:var(--muted); }
  .qbtn.on.rest { background:#0ea5e9; border-color:#0ea5e9; color:#fff; }
  .qbtn.on.out { background:#ec4899; border-color:#ec4899; color:#fff; }
  .dim { opacity:.45; }
  .offnote { align-items:center; background:color-mix(in srgb,#0ea5e9 10%,transparent) !important; }
  .offic { color:#0ea5e9; display:grid; place-items:center; }
  .heat button.today { outline:2px solid var(--fg); outline-offset:2px; }
  .legend { display:flex; gap:14px; margin-top:12px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; }
  .phase { display:grid; grid-template-columns:34px 1fr auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .phase:last-child { border:0; }
  .phase .n { width:34px; height:34px; border-radius:10px; background:var(--soft); display:grid; place-items:center; font-weight:800; color:var(--accent); }
  .phase.cur .n { background:var(--accent); color:#fff; }
  .phase .mile { font-size:12px; color:var(--muted); margin-top:3px; }
  .target { margin-bottom:14px; } .target:last-child { margin:0; }
  .target .r { display:flex; justify-content:space-between; margin-bottom:6px; font-weight:500; }

  /* day cards */
  .day { border-left:5px solid var(--line); margin-bottom:12px; }
  .day.ok { border-left-color:var(--ok); } .day.part { border-left-color:var(--warn); }
  .day.prog { border-left-color:var(--accent); } .day.skip { opacity:.6; }
  .day.today { box-shadow:0 0 0 2px var(--accent), var(--shadow); }
  .dhead { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .dno { font-size:17px; font-weight:700; margin-right:6px; }
  .st { width:auto; min-width:170px; font-weight:600; }
  .g3 { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-bottom:12px; }
  .g4 { display:grid; gap:12px; grid-template-columns:90px 90px repeat(auto-fit,minmax(200px,1fr)); }

  /* list entries */
  .entry { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); align-items:end; margin-bottom:12px; position:relative; padding-right:56px; }
  .entry .del { position:absolute; right:14px; top:14px; width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--muted); font-size:18px; line-height:1; }
  .entry .del:hover { color:var(--bad); border-color:var(--bad); }
  .modal { position:fixed; inset:0; background:rgba(10,10,28,.55); display:grid; place-items:center; padding:20px; z-index:50; }
  .modal .card { width:100%; max-width:380px; }
  .empty { text-align:center; padding:48px 16px; color:var(--muted); }
  .empty .big { font-size:38px; }
  .week { margin-bottom:12px; }
  .week.cur { box-shadow:0 0 0 2px var(--accent), var(--shadow); }

  /* auth */
  #auth { min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(1000px 500px at 20% -10%,#c7d2fe55,transparent),var(--bg); }

  #auth input { margin-bottom:10px; }
  .pw { position:relative; } .pw input { padding-right:44px; }
  .eye { position:absolute; right:6px; top:5px; width:32px; height:32px; border:0; background:none; color:var(--muted); border-radius:8px; display:grid; place-items:center; }
  .eye:hover { color:var(--accent); background:var(--soft); }
  .i { stroke:currentColor; }
  .err { color:var(--bad); min-height:20px; font-size:13px; }

  @media (max-width:820px) {
    #app { flex-direction:column; }
    #side { width:100%; height:auto; position:sticky; z-index:5; flex-direction:row; align-items:center; padding:8px 10px; gap:8px; overflow-x:auto; }

    #tabs .lb { display:none; }
    .side-foot { margin:0 0 0 auto; padding:0; border:0; } .side-foot button { width:auto; }
    .top,main { padding-left:16px; padding-right:16px; } .top h2 { font-size:22px; }
    .g-2 { grid-template-columns:1fr; }
    .g4 { grid-template-columns:1fr 1fr; } .g4 > :nth-child(n+3) { grid-column:1/-1; }
  }
</style>
</head>
